manifest:

    remotes:
      - name: origin
        url-base: ssh://cn4soc.rtkbf.com:29418
      - name: gitee
        url-base: https://gitee.com

    defaults:
      remote: origin

    projects:
      - name: zephyr
        repo-path: HoneyRepo/zephyr
        revision: realtek-main-v3.7
        path: zephyr
        import:
            path-prefix: zephyrproject
            name-allowlist:
              - cmsis
              - tinycrypt
              - mbedtls
              - fatfs

      - name: realtek-app
        repo-path: HoneyRepo/realtek-zephyr-project
        revision: master
        path: zephyrproject/realtek-app
        
      - name: honeygui
        revision: master
        repo-path: HoneyGUI
        path: zephyrproject/modules/honeygui
        
      - name: lvgl
        revision: lvgl_v9
        repo-path: HoneyRepo/lvgl
        path: zephyrproject/modules/lvgl
        
      - name: display
        revision: master
        repo-path: HoneyRepo/driver/display
        path: zephyrproject/modules/display

      - name: wearable
        revision: master
        repo-path: Wearable
        path: zephyrproject/modules/wearable
        
      - name: hal_realtek
        repo-path: HoneyRepo/zephyr-hal
        revision: master
        path: zephyrproject/modules/hal/realtek
        
      - name: rom
        repo-path: HoneyRepo/rom
        revision: bb2ultra-dev
        path: bb2ultra-dev
        
      - name: syspatch
        repo-path: HoneyPatch
        revision: bb2ultra-master-v1.0
        path: bb2ultra-master-v1.0

      - name: lowerpatch
        repo-path: HoneyRepo/lowerpatch
        revision: stack-patch-v4.0
        path: stack-patch-v4.0
        groups: 
            - lowerpatch

      - name: lowerstack
        repo-path: HoneyRepo/lowerstack
        revision: refs/heads/lowerstack-dev-v1.4.1
        path: lowerstack-dev

      - name: mac-driver
        repo-path: HoneyRepo/ZigbeeRepo
        revision: zb-mac-dev
        path: zb-mac-dev
        groups:
            - mac-driver

      - name: sdk
        repo-path: HoneyComb
        revision: release/crb-3.14.0
        path: release-crb-3.14.0

      - name: jenkinsScript
        repo-path: HoneyRepo/build
        revision: v2
        path: jenkinsScript
        groups:
            - jenkinsScript

    - name: hmi
      repo-path: HoneyRepo/hmi
      revision: master
      path: zephyrproject/realtek-app/applications/hmi

    - name: dashboard
      remote: gitee
      repo-path: realmcu/honeygui-template-dashboard
      revision: master
      path: zephyrproject/realtek-app/applications/hmi/ui/dashboard
