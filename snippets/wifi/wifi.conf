# The external 8711FA Wi-Fi companion, reached by AT-over-SPI -- WE ARE THE
# MASTER, and the 8711 runs Realtek's STANDARD AT firmware.
#
# Build:
#   note\build.ps1 -Bank 0 -Snippet wifi -Pristine
# or, equivalently:
#   west build -b rtl87x3g_evb applications/eBadge_8773g_8711f -p always \
#     -S flash_16M_bank0 -S wifi
#
# -Pristine / -p always matters on the first build after adding this snippet,
# and again on every build that adds a .c file: app/spi_at_master/CMakeLists.txt
# uses file(GLOB), so an incremental build does not notice new sources.  The
# refactor adds several (at_parser, at_client, at_wifi, at_socket), which makes
# this the single most likely way to get a confusing link error.
#
# ---------------------------------------------------------------------------
# WHY THIS SNIPPET IS CALLED "wifi" AND WHAT REPLACED WHAT
# ---------------------------------------------------------------------------
# There used to be two mutually exclusive snippets, and picking one was the way
# you chose an SPI role:
#
#   wifi_8711       we were the SPI SLAVE, the 8711 ran a CUSTOM AT command set
#                   that understood the eBadge protocol (EBXF/EBFS/JPGS slots)
#   spi_at_master   we were the SPI MASTER, bring-up harness only
#
# The slave role is retired.  `-S wifi` now simply means "the 8711 is present",
# and the master role is the only role, so the choice the two names encoded no
# longer exists.  See note/spi-master-at-refactor-plan.md for the full plan.
#
# Both of those snippets have since been DELETED, along with app/wifi_8711/ (the
# slave transport and its JPGS/ATMC slot engine).  They are recoverable from git
# history if a bisect ever needs them -- the last commit that still had them is
# the one before this line was written.  Nothing selects them any more, so there
# is no arrangement left in which spi1 and spi1_hs could both be okay.
#
# Pairs wifi.conf + wifi.overlay.  The overlay supplies the spi1_hs /
# spi_at_master_resources / spi_at_master_device / psram1_nc nodes the module
# binds to; this .conf enables the module.  Without the snippet nothing here is
# compiled and a plain build is unaffected.

# An external 8711 exists.  This is the symbol every Wi-Fi caller in
# app/protocol is guarded on (port_softap, port_tcp, jpgs_ingress,
# ebfs_ingress, cmd_debug), so it is what makes the data plane live at all --
# off, each of those parks on a working #else stub and the badge is BLE-only.
#
# Declared in app/spi_at_master/Kconfig, which is also where it moved to when
# app/wifi_8711/ was deleted.  It `select`s SPI_AT_MASTER, so the transport comes
# with it and there is nothing else to turn on here.
CONFIG_WIFI_8711=y

# The transport, and the `atm` shell group that drives it by hand.  Selected by
# the symbol above; spelled out because this file is where you come to read what
# the build contains.
CONFIG_SPI_AT_MASTER=y
CONFIG_SPI_AT_MASTER_SHELL=y

# The bus.
#
# CONFIG_SPI_ASYNC is mandatory here even though the transport calls the
# BLOCKING spi_transceive().  It does not select async behaviour at the API
# level -- it selects which implementation the synchronous path uses:
# spi_rtl87x3g.c:632 falls back to a polled per-frame loop when it is off, and
# only the :641 branch under it drives GDMA.  Without this symbol a 16 KiB slot
# would be byte-banged in a spin loop at 25 MHz.
CONFIG_SPI=y
CONFIG_SPI_ASYNC=y
CONFIG_SPI_RTL87X3G_DMA=y
CONFIG_DMA=y

# Deliberately NOT set:
#
# CONFIG_SPI_SLAVE -- we are the master now.  Harmless if some other snippet
#   pulls it in, but nothing here needs it and spi0_slave stays disabled.
#
# CONFIG_RING_BUFFER -- the slave transport queued slots between its RX-done ISR
#   and a parsing task.  This transport parses on the same thread that clocked
#   the slot, so there is no queue and no ring_buf_* symbol to resolve.
#   NOTE: the AT response parser added in stage 1 may want one; add it then,
#   with a comment saying which layer needs it, rather than pre-enabling it.
