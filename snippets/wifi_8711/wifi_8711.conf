# External 8711 Wi-Fi chip over SPI (AT-over-SPI).
#
# Build:
#   note\build.ps1 -Snippet wifi_8711              (add -Bank 0 for OTA bank0)
# or, equivalently:
#   west build -b rtl87x3g_evb applications/eBadge_8773g_8711f -p always \
#     -S flash_16M_bank0 -S wifi_8711
#
# Pairs wifi_8711.conf + wifi_8711.overlay.  The overlay supplies the
# wifi_8711_device / wifi_8711_resources / psram1_nc DT nodes the SPI master
# binds to; this .conf enables the module itself.  Without the snippet the
# module is not compiled and no SPI driver is built, so a plain build is
# unaffected.
#
# NOTE: see the pin-conflict warning at the top of wifi_8711.overlay -- P4_3 /
# P4_4 are shared with the CST816D touch panel on I2C2.

# The wifi_8711 module: SPI master + AT-over-SPI command engine.
CONFIG_WIFI_8711=y
CONFIG_WIFI_8711_ROLE_MASTER=y

# Shell command group for bring-up (spi init / AT WLCONN / socket poke).
# CONFIG_SHELL is already y in prj.conf, so this is safe to enable.
CONFIG_WIFI_8711_TEST=y

# The SPI bus (spi1_hs) is driven as a DMA async master toward the 8711 AT
# slave.  CONFIG_SPI_RTL87X3G is `default y` but gated on
# DT_HAS_REALTEK_RTL87X3G_SPI_ENABLED, which the overlay's status="okay"
# satisfies -- these symbols select the async + DMA transfer path on top.
CONFIG_SPI=y
CONFIG_SPI_ASYNC=y
CONFIG_SPI_RTL87X3G_DMA=y
CONFIG_DMA=y

# Ring buffer lib (zephyr/lib/utils/ring_buffer.c): TX frame cache in
# app_spi_master_zephyr.c.  Without this the ring_buf_* symbols are
# unresolved at link time.
CONFIG_RING_BUFFER=y
