# External 8711FA Wi-Fi chip over SPI -- WE ARE THE SLAVE.
#
# Build:
#   note\build.ps1 -Snippet wifi_8711              (add -Bank 0 for OTA bank0)
# or, equivalently:
#   west build -b rtl87x3g_evb applications/eBadge_8773g_8711f -p always \
#     -S flash_16M_bank0 -S wifi_8711
#
# Pairs wifi_8711.conf + wifi_8711.overlay.  The overlay supplies the
# spi0_slave / wifi_8711_resources / psram1_nc DT nodes this module binds to;
# this .conf enables the module itself.  Without the snippet the module is not
# compiled and no SPI driver is built, so a plain build is unaffected.
#
# The 8711 is the SPI master (it drives SCLK and CS); we are the passive slave
# and exchange one fixed 4096-byte full-duplex slot per transaction.  See
# note/refer/spi-at-command-protocol 1.md sec.1.

# The wifi_8711 module: SPI slave transport + JPGS/ATMC slot engine.
CONFIG_WIFI_8711=y
CONFIG_WIFI_8711_ROLE_SLAVE=y

# Shell command group for bring-up (probe DT, poke B2W, read W2B).
# CONFIG_SHELL is already y in prj.conf, so this is safe to enable.
CONFIG_WIFI_8711_TEST=y

# The SPI bus.  CONFIG_SPI_RTL87X3G is `default y` but gated on
# DT_HAS_REALTEK_RTL87X3G_SPI_ENABLED, which the overlay's status="okay" on
# spi0_slave satisfies -- these symbols select the async + DMA path on top.
#
# CONFIG_SPI_SLAVE is mandatory, not optional: spi_rtl87x3g.c:971 has a
# BUILD_ASSERT that fails the build outright if spi0_slave is okay without it,
# and spi_transceive() would otherwise reject SPI_OP_MODE_SLAVE.
CONFIG_SPI=y
CONFIG_SPI_SLAVE=y
CONFIG_SPI_ASYNC=y
CONFIG_SPI_RTL87X3G_DMA=y
CONFIG_DMA=y

# Ring buffer lib (zephyr/lib/utils/ring_buffer.c): slot queue between the
# RX-done ISR and the parsing task.  Without this the ring_buf_* symbols are
# unresolved at link time.
CONFIG_RING_BUFFER=y
