# AT-over-SPI toward the external 8711FA -- WE ARE THE MASTER.
#
# Build:
#   note\build.ps1 -Snippet spi_at_master -Pristine    (add -Bank 0 for bank0)
# or, equivalently:
#   west build -b rtl87x3g_evb applications/eBadge_8773g_8711f -p always \
#     -S flash_16M_bank0 -S spi_at_master
#
# -Pristine / -p always matters on the first build after adding this snippet:
# app/spi_at_master/CMakeLists.txt uses file(GLOB), so an incremental build does
# not notice the new .c files.
#
# Do NOT combine with -S wifi_8711.  They claim the same four pads, and
# spi_rtl87x3g.c BUILD_ASSERTs that spi1 and spi1_hs are not both okay.
#
# Pairs spi_at_master.conf + spi_at_master.overlay.  The overlay supplies the
# spi1_hs / spi_at_master_resources / spi_at_master_device / psram1_nc nodes the
# module binds to; this .conf enables the module.  Without the snippet nothing
# here is compiled and a plain build is unaffected.

# The module: master transport + the `atm` shell group that drives it.
CONFIG_SPI_AT_MASTER=y
CONFIG_SPI_AT_MASTER_SHELL=y

# WIFI_8711 is left OFF, which is not merely "the other snippet is absent" --
# it is how "pause the Wi-Fi features" is implemented.  Every caller of the AT
# layer in app/protocol (port_softap, port_tcp, jpgs_ingress, ebfs_ingress,
# cmd_debug) is already wrapped in #if defined(CONFIG_WIFI_8711) with a working
# #else stub, so building without the symbol parks all of them on those stubs
# with zero edits to protocol code.  Re-enabling the old stack later is a
# one-flag operation.

# The bus.
#
# CONFIG_SPI_ASYNC is mandatory here even though the transport calls the
# BLOCKING spi_transceive().  It does not select async behaviour at the API
# level -- it selects which implementation the synchronous path uses:
# spi_rtl87x3g.c:632 falls back to a polled per-frame loop when it is off, and
# only the :641 branch under it drives GDMA.  Without this symbol a 16 KiB slot
# would be byte-banged in a spin loop at 25 MHz.
CONFIG_SPI=y
CONFIG_SPI_ASYNC=y
CONFIG_SPI_RTL87X3G_DMA=y
CONFIG_DMA=y

# Deliberately NOT set:
#
# CONFIG_SPI_SLAVE -- we are the master now.  Harmless if some other snippet
#   pulls it in, but nothing here needs it and spi0_slave stays disabled.
#
# CONFIG_RING_BUFFER -- the slave transport queued slots between its RX-done ISR
#   and a parsing task.  This transport parses on the same thread that clocked
#   the slot, so there is no queue and no ring_buf_* symbol to resolve.
