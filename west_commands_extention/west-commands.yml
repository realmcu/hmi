# West extension commands for the HMI / RustMcuClaw MCU application.
# Referenced from manifest/rtl8773g-zephyr-claw.yml via
# manifest.self.west-commands. ASCII only on purpose: west reads this
# file without specifying utf-8 on Windows (cp1252/gbk locale would
# otherwise crash on Chinese characters).

west-commands:
  - file: applications/claw/west_commands_extention/commands.py
    commands:
      - name: claw-build
        class: HmiBuild
        help: >-
          Build realtek-app/applications/claw/RustMcuClaw/mcu
          (default board: rtl87x3g_watch/rtl8783gbf).
      - name: claw-flash
        class: HmiFlash
        help: Flash the image produced by the previous claw-build.
      - name: claw-clean
        class: HmiClean
        help: Remove the claw build directory.
