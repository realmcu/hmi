# West extension commands configuration

west-commands:
  - file: west_commands_extention/commands.py
    commands:
      - name: info
        class: ProjectInfo
        help: Show project workspace and build status
      - name: build
        class: BuildCommand
        help: Configure and build the firmware (CMake + Ninja)
      - name: clean
        class: CleanCommand
        help: Remove build artifacts
      - name: flash
        class: FlashCommand
        help: Download firmware to device via serial port (mpcli)
      - name: userdata
        class: UserdataCommand
        help: Package (add MP header) and flash a userdata binary, standalone from the app
      - name: size
        class: SizeCommand
        help: Show firmware memory usage via arm-none-eabi-size
      - name: guilib
        class: GuiLibCommand
        help: Build HoneyGUI armclang + arm-none-eabi-gcc libs and sync into src/gui_lib/
      - name: sync
        class: SyncCommand
        help: Run west update then git submodule update for all projects
