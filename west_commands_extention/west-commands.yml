# West extension command configuration
# These custom commands are added to the west command-line tool

west-commands:
  - file: commands.py
    commands:
      - name: info
        class: ProjectInfo
        help: 显示项目版本和构建信息

      - name: clean-all
        class: CleanAll
        help: 清理所有构建产物和缓存

      - name: flash-jlink
        class: FlashJLink
        help: 使用 J-Link 烧录固件到 RTL8773G

      - name: gui-demo
        class: GuiDemo
        help: 构建并运行 GUI 演示应用
