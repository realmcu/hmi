# West 扩展命令配置
# 这些自定义命令将被添加到 west 命令行工具中

west-commands:
  - file: commands.py
    commands:
      - name: info
        class: ProjectInfo
        help: 显示项目版本和构建信息

      - name: clean-all
        class: CleanAll
        help: 清理所有构建产物和缓存

      - name: gui-demo
        class: GuiDemo
        help: 构建并运行 GUI 演示应用
