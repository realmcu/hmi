# Project Configuration for RTL8773G HMI

# 日志配置
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# 控制台配置
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# 主线程配置
CONFIG_MAIN_STACK_SIZE=2048

# 系统配置
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# 添加你的其他配置项
# CONFIG_GPIO=y
# CONFIG_I2C=y
# CONFIG_SPI=y
# CONFIG_DISPLAY=y
