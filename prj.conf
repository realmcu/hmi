# =============================================================================
# Logging destination -- pick one of the three blocks below.
#
# CONFIG_RTK_LOG_BACKEND (src/system/rtk_log_backend.c) formats every log
# message and pushes it out through DBG_DIRECT(), i.e. the Realtek log channel
# that the debug analyzer reads. Because that channel is polled, it also
# survives a crash, which is how the fault dump and the coredump reach the
# analyzer.
#
#   Mode A -- everything to the debug analyzer
#     LOG_*, printk() and printf() go out on the Realtek log channel only.
#     The Zephyr console stays off, so uart2 (P1_1/P1_0) is silent.
#
#   Mode B -- split: the Zephyr log goes to the uart2 console only
#     LOG_*, printk() and printf() go to the console (P1_1 = TX, P1_0 = RX) and
#     are NOT forwarded to the analyzer. Only DBG_DIRECT()/APP_PRINT_* still
#     show up there, because they write to the RTK channel directly and do not
#     go through the log subsystem.
#
#   Mode C -- both channels at the same time
#     LOG_* and printk() go to the console as well and printf() is mirrored
#     there; the analyzer keeps receiving everything.
#
# Pins and baud come from boards/rtl87x3g_evb.overlay, uart2_default:
# UART2_TX = P1_1, UART2_RX = P1_0, 2 Mbaud.
#
# To switch: comment out the block that is active and uncomment another one.
# =============================================================================
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=4096
# Message formatter used by src/system/rtk_log_backend.c. Nothing selects it
# when CONFIG_LOG_BACKEND_UART is off, and the link fails without it.
CONFIG_LOG_OUTPUT=y
# Raise the log processing thread priority and shorten its sleep so LOG_* output
# is not pushed to the very end of the buffer
CONFIG_LOG_PROCESS_THREAD_CUSTOM_PRIORITY=y
CONFIG_LOG_PROCESS_THREAD_PRIORITY=1
CONFIG_LOG_PROCESS_TRIGGER_THRESHOLD=1
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=100

# --- Mode A: debug analyzer only ---------------------------------------------
# CONFIG_RTK_LOG_BACKEND=y
# CONFIG_LOG_BACKEND_UART=n
# CONFIG_SHELL_LOG_BACKEND=n
# CONFIG_CONSOLE=n
# CONFIG_UART_CONSOLE=n

# --- Mode B (active): uart2 console only, nothing forwarded to the analyzer --
CONFIG_RTK_LOG_BACKEND=n
CONFIG_LOG_BACKEND_UART=y
CONFIG_SHELL_LOG_BACKEND=n
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# --- Mode C: analyzer and uart2 console, both live ---------------------------
# CONFIG_RTK_LOG_BACKEND=y
# CONFIG_LOG_BACKEND_UART=y
# CONFIG_SHELL_LOG_BACKEND=n
# CONFIG_CONSOLE=y
# CONFIG_UART_CONSOLE=y

CONFIG_REALTEK_SUBSYS_BLE_MGR=y
CONFIG_RTK_BT_BREDR=y
CONFIG_RTK_BR_PROFILE_A2DP=y
CONFIG_RTK_BR_PROFILE_AVRCP=y
CONFIG_RTK_BR_PROFILE_HFP=y
CONFIG_RTK_BR_PROFILE_PAN=y
CONFIG_SERIAL=y
# The shell owns uart2 on its own (zephyr,shell-uart), independently of
# CONFIG_CONSOLE: it stays available in both modes and only prints when used.
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
# Put the shell thread at the highest priority (0, same as main).
# It blocks in k_poll while idle, so it only burns CPU when a key interrupt wakes it.
CONFIG_SHELL_THREAD_PRIORITY_OVERRIDE=y
CONFIG_SHELL_THREAD_PRIORITY=0
#start display config
CONFIG_REALTEK_HONEYGUI=y
CONFIG_REALTEK_H264_DECODER=y
CONFIG_REALTEK_H264BSD=y
# Do not enable CONFIG_REALTEK_BUILD_EXAMPLE_*_WIDGET here: every example registers
# its own app_init() through GUI_INIT_APP_EXPORT, which collides with the one in
# ui_design/src/dashboardEntry.c (duplicate __honeygui_init_app_init) and would also
# create a second view on the GUI root.
# CONFIG_REALTEK_BUILD_EXAMPLE_VIDEO_WIDGET=y
# CONFIG_REALTEK_BUILD_REAL_CANVAS=y

CONFIG_DISPLAY=y
CONFIG_REALTEK_DISPLAY=y
CONFIG_REALTEK_DISPLAY_ENABLE_LCDC=y
CONFIG_REALTEK_DISPLAY_ENABLE_PPE=y
CONFIG_REALTEK_DISPLAY_ENABLE_IDU=y
CONFIG_REALTEK_DISPLAY_GUI_ACC=y
CONFIG_REALTEK_DISPLAY_ENABLE_JPU=y

CONFIG_REALTEK_LCD_SH8601Z_410_502_QSPI=y
CONFIG_REALTEK_KEY_BUTTON_8773G_ZEPHYR=y
CONFIG_GPIO=y
CONFIG_GPIO_ENABLE_DISABLE_INTERRUPT=y
CONFIG_I2C=y
CONFIG_CPP=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_NEWLIB_LIBC=y
#start display config
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_UART_ASYNC_API=y
CONFIG_SDHC=y
CONFIG_SDIO_STACK=y
CONFIG_HEAP_MEM_POOL_SIZE=2048
