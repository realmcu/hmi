CONFIG_LOG=y
CONFIG_REALTEK_SUBSYS_BLE_MGR=y
CONFIG_RTK_BT_BREDR=y
CONFIG_RTK_BR_PROFILE_A2DP=y
CONFIG_RTK_BR_PROFILE_AVRCP=y
CONFIG_RTK_BR_PROFILE_HFP=y
CONFIG_RTK_BR_PROFILE_PAN=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y

#start display config
CONFIG_REALTEK_HONEYGUI=y
CONFIG_REALTEK_BUILD_EXAMPLE_EBADGE=y
# CONFIG_REALTEK_BUILD_EXAMPLE_IMAGE_WIDGET=y
CONFIG_REALTEK_H264_DECODER=y
CONFIG_REALTEK_H264BSD=y
CONFIG_REALTEK_BUILD_LITE3D=y

CONFIG_DISPLAY=y
CONFIG_REALTEK_DISPLAY=y
CONFIG_REALTEK_DISPLAY_ENABLE_LCDC=y
CONFIG_REALTEK_DISPLAY_ENABLE_PPE=y
CONFIG_REALTEK_DISPLAY_ENABLE_IDU=y
CONFIG_REALTEK_DISPLAY_GUI_ACC=y
CONFIG_REALTEK_DISPLAY_ENABLE_JPU=y

# CONFIG_REALTEK_LCD_ST77916_360_360_QSPI=y
# CONFIG_REALTEK_LCD_ICNA3310_466_466_QSPI=y
# CONFIG_REALTEK_TOUCH_CST816D_ZEPHYR=y

CONFIG_REALTEK_LCD_ST7801N_466_466_QSPI=y
CONFIG_REALTEK_TOUCH_CST820_ZEPHYR=y

CONFIG_REALTEK_KEY_BUTTON_8773G_ZEPHYR=y
CONFIG_GPIO=y
CONFIG_GPIO_ENABLE_DISABLE_INTERRUPT=y

# HOME 键（overlay 里的 key1 = <&gpioa 25>）在 eBadge 硬件上走 MIC1_P 这个 pad，
# 不是复位默认的 P6_0。GPIOA25 是复用 pad，两个候选只能由这个 Kconfig 二选一
# （见 zephyr/drivers/gpio/Kconfig.rtl87x3g:58，default n = P6_0）；
# gpio_rtl87x3g_gpio2pad() 用它决定返回 MIC1_P(pad 69) 还是 P6_0(pad 43)。
# 不开这一项，DT 写 <&gpioa 25> 也一样编得过，但配的是另一根线——所以这是
# 沉默的错，只能靠这里显式声明。
CONFIG_RTL87X3G_USE_MIC1_P_AS_GPIOA25=y
CONFIG_I2C=y
CONFIG_CPP=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_NEWLIB_LIBC=y
#start display config
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_UART_ASYNC_API=y
CONFIG_SDHC=y
CONFIG_SDIO_STACK=y
CONFIG_HEAP_MEM_POOL_SIZE=2048

# RTC：供 posix-device 的 /dev/rtc0（posix_port_rtc.c）使用。
# RTC_RTL87X3G 为 default n，需显式开启（依赖 rtc 节点 status=okay）。
CONFIG_RTC=y
CONFIG_RTC_RTL87X3G=y
