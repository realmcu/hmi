CONFIG_HIGH_LEVEL_BOARD=n
# The HOME key (key1 = <&gpioa 25> in the overlay) uses the MIC1_P pad on eBadge hardware,
# not the reset default P6_0. GPIOA25 is a muxed pad, so this Kconfig chooses between the two candidates
# (see zephyr/drivers/gpio/Kconfig.rtl87x3g:58, default n = P6_0);
# gpio_rtl87x3g_gpio2pad() uses it to decide whether to return MIC1_P (pad 69) or P6_0 (pad 43).
# Without this option, a DT of <&gpioa 25> still builds, but it is wired to the other line -- so this is
# a silent error that only this explicit declaration can catch.
CONFIG_RTL87X3G_USE_MIC1_P_AS_GPIOA25=y
CONFIG_RTL87X3G_USE_MIC1_N_AS_GPIOA26=y
# CONFIG_RTL87X3G_USE_MIC2_P_AS_GPIOA27=y
# CONFIG_RTL87X3G_USE_MIC2_N_AS_GPIOA28=y

CONFIG_I2C=y
CONFIG_CPP=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_NEWLIB_LIBC=y
#start display config
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_UART_ASYNC_API=y
CONFIG_SDHC=y
CONFIG_SDIO_STACK=y
CONFIG_HEAP_MEM_POOL_SIZE=2048

# Required for power_mode_set() to be applied when the kernel becomes idle.
CONFIG_PM=y

# RTC: used by posix-device's /dev/rtc0 (posix_port_rtc.c).
# RTC_RTL87X3G defaults to n and must be enabled explicitly (depends on the rtc node having status=okay).
CONFIG_RTC=y
CONFIG_RTC_RTL87X3G=y

# CPU/RAM usage printing (app/protocol/ebadge_stats.c, one line every 5 seconds) needs the kernel to
# accumulate per-thread/CPU cycle counts on context switches. Only this one menuconfig option is needed:
# SCHED_THREAD_USAGE / SCHED_THREAD_USAGE_ALL / SCHED_THREAD_USAGE_AUTO_ENABLE
# all default to y in kernel/Kconfig:522-553 and are enabled automatically along with it.
# The RAM half relies on CONFIG_SYS_HEAP_RUNTIME_STATS + THREAD_NAME/THREAD_MONITOR,
# which this project already selects elsewhere, so they need not be repeated here.
#
# Note: the printing itself is **off** by default; the switch is EBADGE_STATS_ENABLE in ebadge_stats.h
# (a compile-time macro, not Kconfig). This option is **kept on purpose**: it is the prerequisite for
# printing, not the same thing; keeping it lets a single macro turn the instrumentation on without
# touching prj.conf or re-running CMake. The cost is that the kernel still accumulates cycles on every
# context switch -- this is the real (very small) runtime cost of the feature; turning off that macro
# only silences the console, it does not make the scheduler cheaper. To save even that, remove the line below too; then even with the macro enabled, ebadge_stats.c keeps only the RAM half (it will WARN itself).
CONFIG_THREAD_RUNTIME_STATS=y
