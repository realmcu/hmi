CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=4096
# 提高 log processing thread 优先级 & 缩短睡眠，避免 LOG_* 输出被压到最后
CONFIG_LOG_PROCESS_THREAD_CUSTOM_PRIORITY=y
CONFIG_LOG_PROCESS_THREAD_PRIORITY=1
CONFIG_LOG_PROCESS_TRIGGER_THRESHOLD=1
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=100
CONFIG_REALTEK_SUBSYS_BLE_MGR=y
CONFIG_RTK_BT_BREDR=y
CONFIG_RTK_BR_PROFILE_A2DP=y
CONFIG_RTK_BR_PROFILE_AVRCP=y
CONFIG_RTK_BR_PROFILE_HFP=y
CONFIG_RTK_BR_PROFILE_PAN=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
# Shell thread 提到最高优先级（0，与 main 并列）
# 空闲时 k_poll 阻塞不占 CPU，仅在按键中断时被唤醒
CONFIG_SHELL_THREAD_PRIORITY_OVERRIDE=y
CONFIG_SHELL_THREAD_PRIORITY=0
#start display config
CONFIG_REALTEK_HONEYGUI=y
CONFIG_REALTEK_H264_DECODER=y
CONFIG_REALTEK_H264BSD=y
# CONFIG_REALTEK_BUILD_EXAMPLE_IMAGE_WIDGET=y
# CONFIG_REALTEK_BUILD_REAL_CANVAS=y
CONFIG_REALTEK_BUILD_REAL_EARTH_3D=y

CONFIG_DISPLAY=y
CONFIG_REALTEK_DISPLAY=y
CONFIG_REALTEK_DISPLAY_ENABLE_LCDC=y
CONFIG_REALTEK_DISPLAY_ENABLE_PPE=y
CONFIG_REALTEK_DISPLAY_ENABLE_IDU=y
CONFIG_REALTEK_DISPLAY_GUI_ACC=y
CONFIG_REALTEK_DISPLAY_ENABLE_JPU=y

CONFIG_REALTEK_LCD_ST77916_360_360_QSPI=y
CONFIG_REALTEK_TOUCH_CHSC6417_ZEPHYR=n
CONFIG_REALTEK_KEY_BUTTON_8773G_ZEPHYR=y
CONFIG_GPIO=y
CONFIG_GPIO_ENABLE_DISABLE_INTERRUPT=y
CONFIG_I2C=y
CONFIG_CPP=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_NEWLIB_LIBC=y
#start display config
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_UART_ASYNC_API=y
CONFIG_SDHC=y
CONFIG_SDIO_STACK=y
CONFIG_HEAP_MEM_POOL_SIZE=2048

# TFLite Micro hello_world
CONFIG_CBPRINTF_FP_SUPPORT=n
# arena + interpreter 递归调用栈需要空间；4K 太紧
# 覆盖上面的 4096 —— Kconfig 后写的生效
# 之前 8192 是给 TFLM 解释器递归留的；现在 TFLM 关，6144 够用
CONFIG_MAIN_STACK_SIZE=6144
# 打开 TFLM 和 CMSIS-NN。任一置 n 都会绕过对应 port 目录的编译:
#   CONFIG_APP_TFLITE_MICRO=n        整套 TFLM 都不编
#   CONFIG_APP_CMSIS_NN=n            只编 TFLM, FullyConnected 走 reference
CONFIG_APP_TFLITE_MICRO=n
CONFIG_APP_CMSIS_NN=n

# RTC (posix /dev/rtc0 + editor-level features)
CONFIG_RTC=y
CONFIG_RTC_RTL87X3G=y
CONFIG_RTC_ALARM=y
CONFIG_RTC_UPDATE=y
