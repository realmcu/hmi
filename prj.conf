CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_RTK=n
# Raise the log processing thread priority and shorten its sleep so LOG_* output is not pushed to the end
CONFIG_LOG_PROCESS_THREAD_CUSTOM_PRIORITY=y
CONFIG_LOG_PROCESS_THREAD_PRIORITY=1
CONFIG_LOG_PROCESS_TRIGGER_THRESHOLD=1
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=100
CONFIG_REALTEK_SUBSYS_BLE_MGR=y
CONFIG_RTK_BT_BREDR=y
CONFIG_DFU_NORMAL_OTA=y
CONFIG_RTK_BR_PROFILE_A2DP=y
CONFIG_RTK_BR_PROFILE_AVRCP=y
CONFIG_RTK_BR_PROFILE_HFP=y
CONFIG_REALTEK_SUBSYS_AUDIO=y
# PAN pulls in the IP stack and is unrelated to HFP/A2DP. The additional
# profile does not fit in the watch application partition with DSP enabled.
CONFIG_RTK_BR_PROFILE_PAN=n
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SHELL=n
CONFIG_SHELL_BACKEND_SERIAL=n
#start display config
CONFIG_REALTEK_HONEYGUI=y
# No current watch page uses H.264. Keeping the decoder linked leaves no room
# for the audio stack in the 1.5 MiB application partition.
CONFIG_REALTEK_H264_DECODER=n
CONFIG_REALTEK_H264BSD=n
# CONFIG_REALTEK_BUILD_EXAMPLE_IMAGE_WIDGET=y
# The Designer-generated smartwatch UI replaces the Real Canvas demo.
# Both use GUI_INIT_APP_EXPORT(app_init); enabling both at once redefines __honeygui_init_app_init.
CONFIG_REALTEK_BUILD_REAL_CANVAS=n
# CONFIG_REALTEK_BUILD_REAL_EARTH_3D=y

# HoneyGUI 2.x defaults optional widgets to y. The watch UI only uses the
# core, view, canvas, geometry, list, image and text widgets. Linking the
# remaining widgets overflows the watch application partition.
CONFIG_REALTEK_GUI_WIDGET_SVG=n
CONFIG_REALTEK_GUI_WIDGET_GIF=n
CONFIG_REALTEK_GUI_WIDGET_GLASS=n
CONFIG_REALTEK_GUI_WIDGET_VIDEO=n
CONFIG_REALTEK_GUI_WIDGET_LITE_VIDEO=n
CONFIG_REALTEK_GUI_WIDGET_STREAM=n
CONFIG_REALTEK_GUI_WIDGET_QBCODE=n
CONFIG_REALTEK_GUI_WIDGET_SOCCER=n
CONFIG_REALTEK_GUI_WIDGET_CARD_LIST=n
CONFIG_REALTEK_GUI_WIDGET_MENU_CELLULAR=n
# Console and log output remain enabled. HoneyGUI's separate letter-shell is
# not referenced by the generated watch UI and only consumes application
# partition space. The generated view headers include gui_list.h, so the list
# and canvas widgets remain enabled.
CONFIG_REALTEK_BUILD_LETTER_SHELL=n

CONFIG_DISPLAY=y
CONFIG_REALTEK_DISPLAY=y
CONFIG_REALTEK_DISPLAY_ENABLE_LCDC=y
CONFIG_REALTEK_DISPLAY_ENABLE_PPE=y
CONFIG_REALTEK_DISPLAY_ENABLE_IDU=y
CONFIG_REALTEK_DISPLAY_GUI_ACC=y
CONFIG_REALTEK_DISPLAY_ENABLE_JPU=y

# CONFIG_REALTEK_LCD_ST77916_360_360_QSPI is not set
CONFIG_REALTEK_LCD_AUTO_360_360_QSPI=y
CONFIG_REALTEK_TOUCH_CHSC6417_ZEPHYR=n
CONFIG_REALTEK_KEY_BUTTON_8773G_ZEPHYR=y
CONFIG_GPIO=y
CONFIG_GPIO_ENABLE_DISABLE_INTERRUPT=y
CONFIG_I2C=y
CONFIG_CPP=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_NEWLIB_LIBC=y
#start display config
CONFIG_SIZE_OPTIMIZATIONS_AGGRESSIVE=y
CONFIG_UART_ASYNC_API=y
CONFIG_SDHC=y
CONFIG_SDIO_STACK=y
CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_OSIF_TASK_MAX_COUNT=12

CONFIG_CBPRINTF_FP_SUPPORT=n
# The new upstream display/HoneyGUI code needs a smaller stack footprint to
# keep the fixed RAM region within budget. The main work still runs in the
# application and Bluetooth task stacks.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_IDLE_STACK_SIZE=1024
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=1024
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=768

# RTC (posix /dev/rtc0 + editor-level features)
CONFIG_RTC=y
CONFIG_RTC_RTL87X3G=y
CONFIG_RTC_ALARM=y
CONFIG_RTC_UPDATE=y
