<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HMI app 层架构</title>
<style>
  :root {
    --p-bg: #eef1f4;
    --p-fg: #18212b;
    --p-muted: #596574;
    --p-panel: #ffffff;
    --p-line: #cbd3dc;
    --p-accent: #087b87;
    --p-blue: #2b6fc7;
    --p-green: #2f7d3f;
    --p-amber: #9a6400;
    --p-red: #b03a3a;
    --p-hover: #e8eef0;
    --p-toolbar: rgba(255,255,255,.94);
    --p-shadow: 0 12px 34px rgba(24,33,43,.16);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --p-bg: #14161a;
      --p-fg: #e8eaef;
      --p-muted: #9aa2b0;
      --p-panel: #1b1e24;
      --p-line: #353c48;
      --p-accent: #3fc0cf;
      --p-blue: #7faef0;
      --p-green: #6fce8a;
      --p-amber: #e0a24d;
      --p-red: #ef8f8f;
      --p-hover: #262c36;
      --p-toolbar: rgba(27,30,36,.88);
      --p-shadow: 0 14px 38px rgba(0,0,0,.4);
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--p-bg);
    color: var(--p-fg);
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    font-size: 14px;
    display: flex;
    flex-direction: column;
  }

  .topbar {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 18px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--p-line);
    background: var(--p-toolbar);
  }
  .topbar h1 {
    font-size: 17px;
    font-weight: 650;
    margin: 0;
    letter-spacing: 0;
  }
  .topbar .sub { color: var(--p-muted); font-size: 12px; }
  .spacer { flex: 1; }
  .tb-group {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  button {
    font: inherit;
    color: var(--p-fg);
    background: var(--p-panel);
    border: 1px solid var(--p-line);
    border-radius: 6px;
    min-height: 32px;
    padding: 6px 10px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    line-height: 1.2;
  }
  button:hover { background: var(--p-hover); }
  button:focus-visible, .node:focus-visible .nbox {
    outline: 3px solid color-mix(in srgb, var(--p-accent) 30%, transparent);
    outline-offset: 2px;
  }
  button[aria-pressed="true"] {
    background: var(--p-accent);
    border-color: transparent;
    color: #fff;
  }
  button svg {
    width: 15px;
    height: 15px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .legend {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 7px 18px;
    border-bottom: 1px solid var(--p-line);
    background: var(--p-bg);
    flex-wrap: wrap;
    font-size: 12px;
    color: var(--p-muted);
  }
  .lg { display: inline-flex; align-items: center; gap: 6px; }
  .lg .sw { width: 22px; height: 3px; border-radius: 2px; }
  .lg .sw.amber { background: var(--p-amber); }
  .lg .sw.blue { background: var(--p-blue); }
  .lg .sw.green { background: var(--p-green); }
  .lg .sw.blue.dotted {
    background: repeating-linear-gradient(90deg, var(--p-blue) 0 4px, transparent 4px 7px);
  }
  .lg .sw.red { background: var(--p-red); }

  .layout {
    flex: 1;
    position: relative;
    min-height: 0;
  }
  .stage-wrap {
    position: relative;
    width: 100%;
    height: 100%;
    min-height: 0;
    overflow: hidden;
    user-select: none;
  }
  .stage {
    width: 100%;
    height: 100%;
    position: relative;
    overflow: hidden;
    cursor: grab;
    touch-action: none;
  }
  .stage.dragging { cursor: grabbing; }
  .view {
    position: absolute;
    top: 0;
    left: 0;
    transform-origin: 0 0;
  }
  .view svg { display: block; }

  .panel {
    position: absolute;
    z-index: 5;
    top: 14px;
    right: 14px;
    width: min(350px, calc(100% - 28px));
    max-height: calc(100% - 28px);
    border: 1px solid var(--p-line);
    border-radius: 8px;
    background: var(--p-panel);
    padding: 18px;
    overflow: auto;
    box-shadow: var(--p-shadow);
    transform: translateX(calc(100% + 28px));
    opacity: 0;
    pointer-events: none;
    transition: transform .18s ease, opacity .18s ease;
  }
  .panel.open {
    transform: translateX(0);
    opacity: 1;
    pointer-events: auto;
  }
  .icon-btn {
    width: 32px;
    height: 32px;
    padding: 0;
    justify-content: center;
    float: right;
  }
  .inspect-hint {
    position: absolute;
    z-index: 3;
    right: 14px;
    bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 11px;
    border: 1px solid var(--p-line);
    border-radius: 6px;
    color: var(--p-muted);
    background: var(--p-toolbar);
    box-shadow: 0 4px 14px rgba(24,33,43,.08);
    font-size: 12px;
    pointer-events: none;
  }
  .inspect-hint svg {
    width: 15px;
    height: 15px;
    stroke: var(--p-accent);
    fill: none;
    stroke-width: 2;
  }
  .panel .empty {
    color: var(--p-muted);
    font-size: 13px;
    line-height: 1.6;
  }
  .panel h2 {
    margin: 0 0 2px;
    font-size: 15px;
    font-weight: 650;
    letter-spacing: 0;
  }
  .panel .belt {
    color: var(--p-muted);
    font-size: 12px;
    margin-bottom: 12px;
  }
  .panel p.desc {
    margin: 0 0 14px;
    line-height: 1.65;
    font-size: 13px;
  }
  .block { margin-bottom: 14px; }
  .block .bt {
    font-size: 12px;
    font-weight: 500;
    color: var(--p-muted);
    margin-bottom: 6px;
  }
  .chips {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 6px;
  }
  .chip {
    font-size: 12px;
    padding: 3px 8px;
    min-height: 0;
    border-radius: 5px;
    border: 1px solid var(--p-line);
    background: var(--p-bg);
    line-height: 1.25;
  }
  .chip.pub { border-color: var(--p-blue); color: var(--p-blue); }
  .chip.sub { border-color: var(--p-green); color: var(--p-green); }
  .chip:not(:disabled):hover,
  .chip:not(:disabled):focus-visible,
  .chip.active {
    color: #fff;
  }
  .chip.pub:not(:disabled):hover,
  .chip.pub:not(:disabled):focus-visible,
  .chip.pub.active {
    background: var(--p-blue);
  }
  .chip.sub:not(:disabled):hover,
  .chip.sub:not(:disabled):focus-visible,
  .chip.sub.active {
    background: var(--p-green);
  }
  .chip:disabled {
    cursor: default;
    opacity: .62;
  }

  @media (max-width: 920px) {
    .panel {
      top: auto;
      bottom: 10px;
      right: 10px;
      width: calc(100% - 20px);
      max-height: 48vh;
      transform: translateY(calc(100% + 20px));
    }
    .panel.open { transform: translateY(0); }
    .topbar .sub { display: none; }
    .tb-group {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      width: 100%;
    }
    .tb-group button {
      width: 100%;
      min-width: 0;
      padding: 6px;
      justify-content: center;
    }
    .tb-group button span { display: none; }
    .legend {
      gap: 10px 14px;
      flex-wrap: nowrap;
      overflow-x: auto;
    }
    .lg { flex: 0 0 auto; }
    .inspect-hint { right: 10px; bottom: 10px; }
  }
</style>
</head>
<body>
<header class="topbar">
  <h1>HMI 应用层（app）架构</h1>
  <span class="sub">事件总线 + 单事件分发任务 · applications/app</span>
  <span class="spacer"></span>
  <div class="tb-group" role="group" aria-label="视图控制">
    <button type="button" id="btn-events" aria-pressed="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2-6 4 12 2-6h6"/></svg>
      <span>事件流</span>
    </button>
    <button type="button" id="btn-init" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      <span>初始化顺序</span>
    </button>
    <button type="button" id="btn-zoomout">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
      <span>缩小</span>
    </button>
    <button type="button" id="btn-zoomin">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <span>放大</span>
    </button>
    <button type="button" id="btn-fit">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h6v6M9 21H3v-6M21 9v6M3 15v6M21 3l-6 6M3 21l6-6"/></svg>
      <span>铺满</span>
    </button>
    <button type="button" id="btn-png">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg>
      <span>导出 PNG</span>
    </button>
  </div>
</header>

<div class="legend" aria-label="图例">
  <span class="lg"><span class="sw amber"></span>初始化顺序（app_core.c → 模块）</span>
  <span class="lg"><span class="sw blue"></span>发布事件到总线</span>
  <span class="lg"><span class="sw green"></span>订阅 / 串行分发</span>
  <span class="lg"><span class="sw blue dotted"></span>仅事件定义 / TODO（计划）</span>
  <span class="lg"><span class="sw red"></span>独立接线（未走总线）</span>
</div>

<div class="layout">
  <div class="stage-wrap">
    <div class="stage" id="stage">
      <div class="view" id="view">
        <svg id="diagram" viewBox="0 0 1240 880" width="1240" height="880" role="img"
             aria-labelledby="svg-title svg-desc">
          <title id="svg-title">HMI app 层架构图</title>
          <desc id="svg-desc">main 调 app_core_init()（app_core.c）；app_event.c 提供事件总线与串行分发循环，app_modules.c 提供模块注册表；八个业务模块按依赖顺序注册。业务状态通过事件总线传递，BLE L2 传输与 OTA 使用直接接线。</desc>
          <style>
            #diagram {
              --bg: #fbfcfe; --band: #eef1f5; --band2: #e7f1f1;
              --fg: #232833; --muted: #5f6873; --line: #c9cfd7;
              --node: #ffffff; --accent: #0b828f; --blue: #2b6fc7;
              --green: #2f7d3f; --amber: #9a6400; --red: #a33333;
            }
            @media (prefers-color-scheme: dark) {
              #diagram {
                --bg: #111419; --band: #1a2028; --band2: #16252a;
                --fg: #e7eaef; --muted: #9aa4b2; --line: #39424f;
                --node: #1c212a; --accent: #3fc0cf; --blue: #80aef1;
                --green: #6fce8a; --amber: #e0a24d; --red: #ee8f8f;
              }
            }
            #diagram text {
              font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
              letter-spacing: 0;
            }
            .band { fill: var(--band); stroke: var(--line); stroke-width: 1; }
            .band2 { fill: var(--band2); }
            .band-title { fill: var(--fg); font-size: 16px; font-weight: 650; }
            .band-note { fill: var(--muted); font-size: 11.5px; }

            .node { cursor: pointer; }
            .nbox { fill: var(--node); stroke: var(--line); stroke-width: 1.3; }
            .node:hover .nbox,
            .node.hl .nbox,
            .node.sel .nbox {
              stroke: var(--accent);
              stroke-width: 2.2;
            }
            .node.sel .nbox { filter: url(#glow); }
            .core-node .nbox { stroke: var(--accent); }
            .ota-wrap .nbox { stroke: var(--red); stroke-dasharray: 7 5; }
            .nname { fill: var(--fg); font-size: 15px; font-weight: 650; }
            .nrole { fill: var(--muted); font-size: 12px; }
            .ntag { fill: var(--muted); font-size: 11px; }
            .nbadge { fill: var(--accent); stroke: var(--node); stroke-width: 1.5; }
            .nbadge-text { fill: #fff; font-size: 11px; text-anchor: middle; }

            .dim .node:not(.sel):not(.hl) .nbox { opacity: .32; }
            .dim .node:not(.sel):not(.hl) text { opacity: .35; }
            .dim .node:not(.sel):not(.hl) .nbadge { opacity: .4; }

            .e { fill: none; }
            .e, .elabel { transition: opacity .12s, stroke-width .12s; }
            .e-core { stroke: var(--line); stroke-width: 1.6; }
            .e-init { stroke: var(--amber); stroke-width: 1.5; stroke-dasharray: 6 5; }
            .e-pub { stroke: var(--blue); stroke-width: 2; }
            .e-sub { stroke: var(--green); stroke-width: 1.8; stroke-dasharray: 7 5; }
            .e-plan { stroke: var(--blue); stroke-width: 1.8; stroke-dasharray: 2 5; opacity: .75; }
            .e-ota { stroke: var(--red); stroke-width: 1.8; stroke-dasharray: 8 5; }
            .elabel {
              fill: var(--muted);
              font-size: 10.5px;
              paint-order: stroke;
              stroke: var(--bg);
              stroke-width: 4;
              stroke-linejoin: round;
            }
            .elabel.core-label { stroke: var(--band); }
            .tips { fill: var(--fg); font-size: 11px; }

            #diagram.dim .e { opacity: 0; pointer-events: none; }
            #diagram.dim .e.on { opacity: 1; stroke-width: 3; }
            #diagram.dim .elabel { opacity: 0; }
            #diagram.dim .elabel.on { opacity: 1; }
            .e.on { stroke-width: 3; }

            #diagram.events-off .e-pub,
            #diagram.events-off .e-sub,
            #diagram.events-off .e-plan { display: none; }
            #diagram.init-off .e-init { display: none; }
            .node.hl .nbox, .node.sel .nbox { transition: stroke .12s; }

            @media (prefers-reduced-motion: reduce) {
              .node.hl .nbox, .node.sel .nbox { transition: none; }
            }
          </style>

          <defs>
            <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
              <feGaussianBlur stdDeviation="4" result="b"/>
              <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
            <marker id="mk-core" viewBox="0 0 10 10" refX="8" refY="5"
                    markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M0 0 L10 5 L0 10 z" fill="var(--line)"/>
            </marker>
            <marker id="mk-init" viewBox="0 0 10 10" refX="8" refY="5"
                    markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M0 0 L10 5 L0 10 z" fill="var(--amber)"/>
            </marker>
            <marker id="mk-pub" viewBox="0 0 10 10" refX="8" refY="5"
                    markerWidth="8" markerHeight="8" orient="auto-start-reverse">
              <path d="M0 0 L10 5 L0 10 z" fill="var(--blue)"/>
            </marker>
            <marker id="mk-sub" viewBox="0 0 10 10" refX="8" refY="5"
                    markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M0 0 L10 5 L0 10 z" fill="var(--green)"/>
            </marker>
            <marker id="mk-ota" viewBox="0 0 10 10" refX="8" refY="5"
                    markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M0 0 L10 5 L0 10 z" fill="var(--red)"/>
            </marker>
          </defs>

          <!-- bands -->
          <rect class="band" x="36" y="128" width="1168" height="150"/>
          <text class="band-title" x="52" y="116">app_core 目录 · 应用层运行时</text>
          <rect class="band band2" x="36" y="300" width="1168" height="548"/>
          <text class="band-title" x="52" y="288">功能模块 · 注册顺序即依赖顺序</text>
          <text class="band-note" x="432" y="288">main 按序 init 各模块；app_task 仅负责事件分发，模块可拥有专用任务</text>
          <text class="tips" x="24" y="872">拖拽平移 · 滚轮缩放 · 点击模块查看详情 · 空白处双击复位</text>

          <!-- core internals -->
          <path class="e e-core" data-from="app_core" data-to="app_event"
                d="M344 200 H472" marker-end="url(#mk-core)"/>
          <text class="elabel core-label" x="352" y="190">建队列 · 起分发 app_task</text>
          <text class="elabel core-label" x="352" y="204">跑 run_forever</text>
          <path class="e e-core" data-from="app_core" data-to="app_modules"
                d="M204 156 C 204 142, 1016 142, 1016 156" marker-end="url(#mk-core)"/>
          <text class="elabel core-label" x="600" y="132">读取注册表（顺序即依赖）</text>

          <!-- boot arrow -->
          <path class="e e-core" data-from="main" data-to="app_core"
                d="M204 96 V156" marker-end="url(#mk-core)"/>
          <text class="elabel core-label" x="250" y="130">boot：app_core_init()</text>

          <!-- init edges -->
          <g class="group-init" style="display:none">
            <path class="e e-init" data-from="app_core" data-to="time" d="M204 244 V312 H188 V332" marker-end="url(#mk-init)"/>
            <path class="e e-init" data-from="app_core" data-to="power" d="M204 244 V312 H480 V332" marker-end="url(#mk-init)"/>
            <path class="e e-init" data-from="app_core" data-to="setting" d="M204 244 V312 H772 V332" marker-end="url(#mk-init)"/>
            <path class="e e-init" data-from="app_core" data-to="bt" d="M204 244 V312 H1064 V332" marker-end="url(#mk-init)"/>
            <path class="e e-init" data-from="app_core" data-to="proto" d="M204 244 V312 H332 V504 H188 V516" marker-end="url(#mk-init)"/>
            <path class="e e-init" data-from="app_core" data-to="health" d="M204 244 V312 H332 V504 H480 V516" marker-end="url(#mk-init)"/>
            <path class="e e-init" data-from="app_core" data-to="media" d="M204 244 V312 H332 V504 H772 V516" marker-end="url(#mk-init)"/>
            <path class="e e-init" data-from="app_core" data-to="notify" d="M204 244 V312 H332 V504 H1064 V516" marker-end="url(#mk-init)"/>
            <text class="elabel" x="92" y="262">init(m) 逐个</text>
          </g>

          <!-- publish edges -->
          <path class="e e-pub" data-from="time" data-to="app_event" d="M188 336 C188 292 500 292 500 248" marker-end="url(#mk-pub)"/>
          <text class="elabel" x="252" y="300">TICK_15MIN / DAY_CHANGED</text>
          <path class="e e-plan" data-from="power" data-to="app_event" d="M480 336 C480 292 540 292 540 248" marker-end="url(#mk-pub)"/>
          <text class="elabel" x="420" y="300">EVT_POWER_*（计划）</text>
          <path class="e e-plan" data-from="setting" data-to="app_event" d="M772 336 C772 292 580 292 580 248" marker-end="url(#mk-pub)"/>
          <text class="elabel" x="600" y="300">SETTING_CHANGED（计划）</text>
          <path class="e e-pub" data-from="bt" data-to="app_event" d="M1064 336 C1064 292 620 292 620 248" marker-end="url(#mk-pub)"/>
          <text class="elabel" x="818" y="300">EVT_BLE_*</text>

          <path class="e e-pub" data-from="proto" data-to="app_event" d="M188 520 C188 396 600 320 660 248" marker-end="url(#mk-pub)"/>
          <text class="elabel" x="300" y="428">EVT_USER_* / 校时</text>
          <path class="e e-pub" data-from="health" data-to="app_event" d="M480 520 C480 396 640 320 700 248" marker-end="url(#mk-pub)"/>
          <text class="elabel" x="526" y="448">STEPS_UPDATED</text>
          <path class="e e-plan" data-from="media" data-to="app_event" d="M772 520 C772 396 690 320 730 248" marker-end="url(#mk-pub)"/>
          <text class="elabel" x="668" y="470">EVT_MEDIA_*（骨架）</text>
          <path class="e e-plan" data-from="notify" data-to="app_event" d="M1064 520 C1064 396 740 320 760 248" marker-end="url(#mk-pub)"/>
          <text class="elabel" x="878" y="470">EVT_NOTIFY_*（骨架）</text>

          <!-- subscribe / dispatch edges -->
          <path class="e e-sub" data-from="app_event" data-to="proto"
                d="M548 248 C548 342 188 390 188 516" marker-end="url(#mk-sub)"/>
          <text class="elabel" x="270" y="414">订 BLE_*</text>
          <path class="e e-sub" data-from="app_event" data-to="health"
                d="M620 248 C620 344 480 410 480 516" marker-end="url(#mk-sub)"/>
          <text class="elabel" x="506" y="426">订 TIME / USER / POWER</text>

          <!-- direct wiring outside app_event -->
          <path class="e e-ota" data-from="bt" data-to="proto"
                d="M1064 428 C1064 486 188 458 188 516" marker-end="url(#mk-ota)"/>
          <text class="elabel" x="620" y="490">注入 BLE send / receive，启动 proto / l2 tasks</text>
          <path class="e e-ota" data-from="bt" data-to="ota"
                d="M1188 400 H1206 V708 H1188" marker-end="url(#mk-ota)"/>

var emptyEl = document.getElementById('empty');
var detailEl = document.getElementById('detail');
var panelEl = document.getElementById('panel');
var inspectHintEl = document.getElementById('inspect-hint');

function eventTargets(sourceId, eventName, kind) {
  var opposite = kind === 'pub' ? 'sub' : 'pub';
  var targets = [];
  for (var id in DATA) {
    if (id !== sourceId && DATA[id][opposite].indexOf(eventName) !== -1) {
      targets.push(id);
    }
  }
  return targets;
}

function renderEventChip(sourceId, eventName, kind) {
  var targets = eventTargets(sourceId, eventName, kind);
  var targetKind = kind === 'pub' ? '订阅' : '发布';
  var targetNames = targets.map(function (id) { return DATA[id].t; }).join('、');
  var title = targets.length
    ? '单击定位到' + targetKind + '模块：' + targetNames
    : '暂无对应' + targetKind + '模块';
  return '<button type="button" class="chip ' + kind + '" data-event="' + eventName +
    '" data-kind="' + kind + '" title="' + title + '"' +
    (targets.length ? '' : ' disabled') + '>' + eventName + '</button>';
}

function showDetail(id) {
  var n = DATA[id];
  if (!n) return;
  emptyEl.hidden = true;
  detailEl.hidden = false;
  panelEl.classList.add('open');
  inspectHintEl.hidden = true;
  var pub = n.pub.map(function (e) { return renderEventChip(id, e, 'pub'); }).join('');
  var sub = n.sub.map(function (e) { return renderEventChip(id, e, 'sub'); }).join('');
  detailEl.innerHTML =
    '<div class="belt">' + n.t + ' · ' + n.belt + '</div>' +
    '<h2>' + n.t.split(' ')[0].split('.')[0] + '</h2>' +
    '<p class="desc">' + n.d + '</p>' +
    (pub ? '<div class="block"><div class="bt">发布</div><div class="chips">' + pub + '</div></div>' : '') +
    (sub ? '<div class="block"><div class="bt">订阅</div><div class="chips">' + sub + '</div></div>' : '');
}

function setEdgeActive(edge, active) {
  edge.classList.toggle('on', active);
  var sibling = edge.nextElementSibling;
  while (sibling && sibling.classList.contains('elabel')) {
    sibling.classList.toggle('on', active);
    sibling = sibling.nextElementSibling;
  }
}

function clearDetail() {
  emptyEl.hidden = true;
  detailEl.hidden = true;
  panelEl.classList.remove('open');
  inspectHintEl.hidden = false;
  SVG.classList.remove('dim');
  var nodes = SVG.querySelectorAll('.node');
  for (var i = 0; i < nodes.length; i++) {
    nodes[i].classList.remove('sel', 'hl');
  }
  var edges = SVG.querySelectorAll('.e, .elabel');
  for (var j = 0; j < edges.length; j++) {
    edges[j].classList.remove('on');
  }
}

function neighborsOf(id) {
  var set = {};
  var edges = SVG.querySelectorAll('.e');
  for (var i = 0; i < edges.length; i++) {
    var f = edges[i].getAttribute('data-from');
    var t = edges[i].getAttribute('data-to');
    if (f === id) { set[t] = 1; setEdgeActive(edges[i], true); }
    else if (t === id) { set[f] = 1; setEdgeActive(edges[i], true); }
  }
  var res = [];
  for (var k in set) res.push(k);
  return res;
}

function highlight(id, mode) {
  var nodes = SVG.querySelectorAll('.node');
  for (var i = 0; i < nodes.length; i++) {
    var nid = nodes[i].getAttribute('data-node');
    nodes[i].classList.toggle('hl', mode && nid === id);
  }
  var edges = SVG.querySelectorAll('.e');
  for (var j = 0; j < edges.length; j++) {
    var f = edges[j].getAttribute('data-from');
    var t = edges[j].getAttribute('data-to');
    setEdgeActive(edges[j], mode && (f === id || t === id));
  }
}

function selectNode(id) {
  clearDetail();
  var neigh = neighborsOf(id);
  var nodes = SVG.querySelectorAll('.node');
  for (var i = 0; i < nodes.length; i++) {
    var nid = nodes[i].getAttribute('data-node');
    if (nid === id) nodes[i].classList.add('sel');
    else if (neigh.indexOf(nid) !== -1) nodes[i].classList.add('hl');
  }
  SVG.classList.add('dim');
  showDetail(id);
}

function centerNodes(ids) {
  var boxes = [];
  for (var i = 0; i < ids.length; i++) {
    var node = SVG.querySelector('.node[data-node="' + ids[i] + '"]');
    if (node) boxes.push(node.getBBox());
  }
  if (!boxes.length) return;

  var minX = boxes[0].x;
  var minY = boxes[0].y;
  var maxX = boxes[0].x + boxes[0].width;
  var maxY = boxes[0].y + boxes[0].height;
  for (var j = 1; j < boxes.length; j++) {
    minX = Math.min(minX, boxes[j].x);
    minY = Math.min(minY, boxes[j].y);
    maxX = Math.max(maxX, boxes[j].x + boxes[j].width);
    maxY = Math.max(maxY, boxes[j].y + boxes[j].height);
  }

  var panelWidth = panelEl.classList.contains('open') ? panelEl.offsetWidth + 28 : 0;
  var availableWidth = Math.max(240, stage.clientWidth - panelWidth);
  var boundsWidth = Math.max(1, maxX - minX);
  var boundsHeight = Math.max(1, maxY - minY);
  var fitScale = Math.min(
    (availableWidth - 80) / boundsWidth,
    (stage.clientHeight - 80) / boundsHeight
  );
  k = Math.max(0.35, Math.min(k, fitScale));
  tx = (availableWidth - boundsWidth * k) / 2 - minX * k;
  ty = (stage.clientHeight - boundsHeight * k) / 2 - minY * k;
  fitted = false;
  apply();
}

function focusEvent(sourceId, eventName, kind) {
  var targets = eventTargets(sourceId, eventName, kind);
  if (!targets.length) return;

  var nodes = SVG.querySelectorAll('.node');
  for (var i = 0; i < nodes.length; i++) {
    var nodeId = nodes[i].getAttribute('data-node');
    nodes[i].classList.toggle('sel', nodeId === sourceId);
    nodes[i].classList.toggle('hl', targets.indexOf(nodeId) !== -1);
  }

  var edges = SVG.querySelectorAll('.e');
  for (var j = 0; j < edges.length; j++) {
    var from = edges[j].getAttribute('data-from');
    var to = edges[j].getAttribute('data-to');
    var on = kind === 'pub'
      ? (from === sourceId && to === 'app_event') ||
        (from === 'app_event' && targets.indexOf(to) !== -1)
      : (targets.indexOf(from) !== -1 && to === 'app_event') ||
        (from === 'app_event' && to === sourceId);
    setEdgeActive(edges[j], on);
  }

  SVG.classList.add('dim');
  var chips = detailEl.querySelectorAll('.chip');
  for (var ci = 0; ci < chips.length; ci++) {
    chips[ci].classList.toggle(
      'active',
      chips[ci].getAttribute('data-event') === eventName &&
      chips[ci].getAttribute('data-kind') === kind
    );
  }
  centerNodes(targets);
}

detailEl.addEventListener('click', function (ev) {
  var chip = ev.target.closest('.chip[data-event]');
  if (!chip || chip.disabled) return;
  focusEvent(
    SVG.querySelector('.node.sel').getAttribute('data-node'),
    chip.getAttribute('data-event'),
    chip.getAttribute('data-kind')
  );
});

var nodes = SVG.querySelectorAll('.node');
for (var ni = 0; ni < nodes.length; ni++) {
  (function (el) {
    var id = el.getAttribute('data-node');
    el.addEventListener('mouseenter', function () {
      if (!SVG.querySelector('.node.sel')) highlight(id, true);
    });
    el.addEventListener('mouseleave', function () {
      if (!SVG.querySelector('.node.sel')) highlight(id, false);
    });
    el.addEventListener('click', function (ev) {
      ev.stopPropagation();
      var wasSel = el.classList.contains('sel');
      clearDetail();
      if (!wasSel) selectNode(id);
    });
    el.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' || ev.key === ' ') {
        ev.preventDefault();
        var wasSel = el.classList.contains('sel');
        clearDetail();
        if (!wasSel) selectNode(id);
      } else if (ev.key === 'Escape') {
        clearDetail();
      }
    });
  })(nodes[ni]);
}

document.getElementById('btn-events').addEventListener('click', function () {
  var pressed = this.getAttribute('aria-pressed') === 'true';
  this.setAttribute('aria-pressed', String(!pressed));
  SVG.classList.toggle('events-off', pressed);
});
document.getElementById('btn-init').addEventListener('click', function () {
  var pressed = this.getAttribute('aria-pressed') === 'true';
  this.setAttribute('aria-pressed', String(!pressed));
  SVG.classList.toggle('init-off', pressed);
  var group = SVG.querySelector('.group-init');
  if (group) group.style.display = pressed ? 'none' : '';
});
document.getElementById('panel-close').addEventListener('click', clearDetail);

/* pan / zoom */
var k = 1, tx = 0, ty = 0, fitted = true;
function fit() {
  var w = stage.clientWidth || 800;
  var h = stage.clientHeight || 600;
  var bw = 1240, bh = 880;
  k = Math.min((w - 8) / bw, (h - 8) / bh);
  tx = Math.max(4, (w - bw * k) / 2);
  ty = Math.max(4, Math.min(40, (h - bh * k) / 2));
  apply();
}
function apply() {
  view.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + k + ')';
}
stage.addEventListener('wheel', function (ev) {
  ev.preventDefault();
  fitted = false;
  var rect = stage.getBoundingClientRect();
  var mx = ev.clientX - rect.left;
  var my = ev.clientY - rect.top;
  var px = (mx - tx) / k;
  var py = (my - ty) / k;
  var ns = ev.deltaY < 0 ? 1.12 : 0.9;
  k = Math.min(3.2, Math.max(0.35, k * ns));
  tx = mx - px * k;
  ty = my - py * k;
  apply();
}, { passive: false });

document.getElementById('btn-zoomin').addEventListener('click', function () {
  fitted = false;
  var cx = stage.clientWidth / 2;
  var cy = stage.clientHeight / 2;
  var px = (cx - tx) / k;
  var py = (cy - ty) / k;
  k = Math.min(3.2, k * 1.15);
  tx = cx - px * k;
  ty = cy - py * k;
  apply();
});
document.getElementById('btn-zoomout').addEventListener('click', function () {
  fitted = false;
  var cx = stage.clientWidth / 2;
  var cy = stage.clientHeight / 2;
  var px = (cx - tx) / k;
  var py = (cy - ty) / k;
  k = Math.max(0.35, k / 1.15);
  tx = cx - px * k;
  ty = cy - py * k;
  apply();
});
document.getElementById('btn-fit').addEventListener('click', function () {
  fit();
  fitted = true;
});

var dragging = false, sx = 0, sy = 0, stx = 0, sty = 0;
stage.addEventListener('pointerdown', function (ev) {
  if (ev.target.closest && ev.target.closest('.node')) return;
  dragging = true;
  fitted = false;
  sx = ev.clientX; sy = ev.clientY;
  stx = tx; sty = ty;
  stage.classList.add('dragging');
  stage.setPointerCapture(ev.pointerId);
});
stage.addEventListener('pointermove', function (ev) {
  if (!dragging) return;
  tx = stx + (ev.clientX - sx);
  ty = sty + (ev.clientY - sy);
  apply();
});
function endDrag() {
  dragging = false;
  stage.classList.remove('dragging');
}
stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', endDrag);
stage.addEventListener('dblclick', function () {
  fit();
  fitted = true;
});

window.addEventListener('resize', function () {
  if (fitted) fit();
});

/* export PNG */
document.getElementById('btn-png').addEventListener('click', function () {
  var clone = SVG.cloneNode(true);
  clone.setAttribute('width', 2480);
  clone.setAttribute('height', 1760);
  clone.setAttributeNS('http://www.w3.org/2000/xmlns/', 'xmlns', 'http://www.w3.org/2000/svg');
  var xml = new XMLSerializer().serializeToString(clone);
  var svg64 = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(xml);
  var img = new Image();
  img.onload = function () {
    var c = document.createElement('canvas');
    c.width = 2480; c.height = 1760;
    var ctx = c.getContext('2d');
    ctx.fillStyle = getComputedStyle(SVG).getPropertyValue('--bg').trim() || '#ffffff';
    ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(img, 0, 0, 2480, 1760);
    c.toBlob(function (blob) {
      var a = document.createElement('a');
      a.download = 'app-architecture.png';
      a.href = URL.createObjectURL(blob);
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
    }, 'image/png');
  };
  img.src = svg64;
});

fit();
</script>
</body>
</html>
