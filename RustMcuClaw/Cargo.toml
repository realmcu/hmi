[package]
name = "rustmcuclaw"
version = "0.1.0"
edition = "2021"
description = "A memory-safe Rust terminal assistant inspired by OpenClaw, with chat, long-term memory, tasks, heartbeat and multi-LLM providers."
license = "MIT"

[workspace]
members = [
	".",
	"crates/rustmcuclaw-common",
	"crates/rustmcuclaw-mcu",
]
resolver = "2"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde", "clock"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "5.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustyline = "14.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
rustmcuclaw-common = { path = "crates/rustmcuclaw-common" }
uuid = { version = "1.8", features = ["v4", "serde"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
