data_dir = "data"

[provider]
# 可选：mock, open_ai, kimi, github_models, github_copilot_compatible, open_ai_compatible
kind = "mock"
model = "mock-local"
# 可选：直接填 API Key；更推荐使用下面的 api_key_env
# api_key = ""
# endpoint = "https://api.openai.com/v1/chat/completions"
api_key_env = "OPENAI_API_KEY"
temperature = 0.7
max_tokens = 2048

[chat]
history_limit = 12
# 一次用户消息最多触发多少轮 “LLM → 工具 → 结果 → LLM” 循环。
# 1 = 关闭循环（经典单轮）；>=2 才允许 claw 把工具结果回灌给 LLM 继续推理。
max_tool_loops = 4

[heartbeat]
enabled = true
interval_secs = 60

[files]
soul = "soul.md"
user = "user.md"
role = "role.md"
summary_memory = "summary_memory.jsonl"
tasks = "tasks.json"

# 飞书 / Lark 开放平台 App 凭证。MCU 端目前持久化并在 /doctor 展示；
# 长连接事件订阅由 Z2Plus AT 命令 ATFW 提供 bootstrap，wss 帧层下一轮接入。
# Secret 强烈建议直接在 SD 卡 rmcc.toml 中填写，不要提交到仓库。
[channels.feishu]
enabled = false
app_id = "cli_a92512f2f3391bd4"
app_secret = ""
endpoint = "https://open.feishu.cn"
