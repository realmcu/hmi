data_dir = "data"

[provider]
# Optional: mock, open_ai, kimi, github_models, github_copilot_compatible, open_ai_compatible
kind = "mock"
model = "mock-local"
# Optional: fill in the API Key directly; using api_key_env below is recommended instead
# api_key = ""
# endpoint = "https://api.openai.com/v1/chat/completions"
api_key_env = "OPENAI_API_KEY"
temperature = 0.7
max_tokens = 2048

[chat]
history_limit = 12
# Maximum number of "LLM -> tool -> result -> LLM" loops triggered by one user message.
# 1 = disable the loop (classic single turn); >=2 allows claw to feed tool results back to the LLM for further reasoning.
max_tool_loops = 4

[heartbeat]
enabled = true
interval_secs = 60

[files]
soul = "soul.md"
user = "user.md"
role = "role.md"
summary_memory = "summary_memory.jsonl"
tasks = "tasks.json"

# Feishu / Lark Open Platform app credentials. The MCU side currently persists them and shows them in /doctor;
# Long-connection event subscription bootstraps via the Z2Plus AT command ATFW; the wss frame layer will be integrated next round.
# It is strongly recommended to fill in the secret directly in rmcc.toml on the SD card, not to commit it to the repository.
[channels.feishu]
enabled = false
app_id = "cli_a92512f2f3391bd4"
app_secret = ""
endpoint = "https://open.feishu.cn"
