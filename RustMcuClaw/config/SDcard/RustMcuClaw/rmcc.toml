data_dir = "/SD:/RustMcuClaw"

[provider]
# 可选：mock, open_ai, kimi, github_models, github_copilot_compatible, open_ai_compatible
kind = "kimi"
model = "kimi-k2.6"
# API Key 直接填在这里（SD 卡不提交仓库，安全）
api_key = "sk-"
endpoint = "https://api.moonshot.cn/v1/chat/completions"
temperature = 1
max_tokens = 2048

[chat]
history_limit = 4
# 1 = 关闭循环（经典单轮）；>=2 允许工具结果回灌 LLM 继续推理
max_tool_loops = 4

[heartbeat]
enabled = true
interval_secs = 60

[files]
soul = "soul.md"
user = "user.md"
role = "role.md"
summary_memory = "summary_memory.jsonl"
tasks = "tasks.json"

[channels.feishu]
enabled = true
app_id = "cli_"
app_secret = ""
endpoint = "https://open.feishu.cn"
