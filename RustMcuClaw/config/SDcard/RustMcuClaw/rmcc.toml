data_dir = "/SD:/RustMcuClaw"

[provider]
# Optional: mock, open_ai, kimi, github_models, github_copilot_compatible, open_ai_compatible
kind = "kimi"
model = "kimi-k2.6"
# Fill in the API Key directly here (the SD card is not committed to the repository, so it is safe)
api_key = "sk-"
endpoint = "https://api.moonshot.cn/v1/chat/completions"
temperature = 1
max_tokens = 2048

[chat]
history_limit = 4
# 1 = disable the loop (classic single turn); >=2 allows tool results to be fed back to the LLM for further reasoning
max_tool_loops = 4

[heartbeat]
enabled = true
interval_secs = 60

[files]
soul = "soul.md"
user = "user.md"
role = "role.md"
summary_memory = "summary_memory.jsonl"
tasks = "tasks.json"

[channels.feishu]
enabled = true
app_id = "cli_"
app_secret = ""
endpoint = "https://open.feishu.cn"
