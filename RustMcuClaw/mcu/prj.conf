# RustMcuClaw MCU: serial CLI + PSRAM FATFS JSON/TOML/Markdown files.
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

CONFIG_MULTITHREADING=y
CONFIG_POLL=y

CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

CONFIG_DISPLAY=y
CONFIG_REALTEK_DISPLAY=y
CONFIG_REALTEK_DISPLAY_ENABLE_LCDC=y
CONFIG_REALTEK_DISPLAY_ENABLE_PPE=y
CONFIG_REALTEK_DISPLAY_ENABLE_IDU=n
CONFIG_REALTEK_WEARABLE=y
CONFIG_REALTEK_LCD_SH8601Z_410_502_QSPI=y
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_DMA=y

# Touch screen (CHSC6417 on I2C1, interrupt-driven via GPIO)
CONFIG_REALTEK_TOUCH_CHSC6417_ZEPHYR=y

CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_RAM=y
CONFIG_SDHC=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_SDHC_LOG_LEVEL_DBG=y
CONFIG_SD_LOG_LEVEL_DBG=y
CONFIG_FS_FATFS_MOUNT_MKFS=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_MAX_LFN=64

CONFIG_NEWLIB_LIBC=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# The cloud transport is provided by the Z2Plus/RTL8710C firmware side.
# Board integration should provide/override claw_mcu_https_post_json() if the
# firmware exposes a different HTTPS primitive.
CONFIG_NET_BUF=y

# DHT11 温湿度传感器（Zephyr 官方 aosong,dht 驱动）
CONFIG_SENSOR=y
CONFIG_DHT=y
# 读取传感器时锁 IRQ，提高单总线时序采样成功率
CONFIG_DHT_LOCK_IRQS=y
