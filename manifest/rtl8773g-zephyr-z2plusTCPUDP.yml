manifest:
  self:
    path: realtek-app

  remotes:
    - name: origin
      url-base: ssh://cn4soc.rtkbf.com:29418

  defaults:
    remote: origin

  projects:
    - name: zephyr
      repo-path: HoneyRepo/zephyr
      revision: realtek-main-v3.7
      path: zephyr
      import:
        name-allowlist:
          - cmsis
          - tinycrypt
          - mbedtls
          - fatfs

    - name: wearable
      revision: master
      repo-path: Wearable
      path: modules/wearable

    - name: hal_realtek
      repo-path: HoneyRepo/zephyr-hal
      revision: master
      path: modules/hal/realtek
