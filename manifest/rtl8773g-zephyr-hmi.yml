# RTL8773G Zephyr HMI 项目 West manifest
#
# 用法 (在 zephyrproject 仓库已经 clone 完成的前提下):
#
#   cd C:\Users\triton_yu\Documents\hmi\zephyrproject
#   west init -l realtek-app\applications\hmi\manifest
#   west update
#
# 之后即可在任意位置运行：
#
#   west build -b rtl87x3g_watch/rtl8783gbf `
#       realtek-app\applications\hmi\RustMcuClaw\mcu
#
# 或者使用本工程提供的扩展命令：
#
#   west hmi-build               # 默认 rtl87x3g_watch/rtl8783gbf
#   west hmi-build -b rtl87x3g_watch/rtl8773gtp
#   west hmi-flash
#
# 详见 realtek-app/applications/hmi/west_commands_extention/README.md
#
# 注意:
#   self.path 是 manifest 文件所在目录相对 west workspace 顶层 (topdir)
#   的路径。这里假设 topdir 是 zephyrproject\，因此 self.path 指向
#   realtek-app/applications/hmi/manifest。
#
#   group-filter 中带 - 前缀的组在默认 `west update` 时不会被拉取，
#   保持和 realtek-app/west.yml 一致即可。

manifest:
  self:
    # West topdir is C:\Users\triton_yu\Documents\hmi\zephyrproject.
    # The manifest project must be `realtek-app` itself so that Zephyr
    # picks up realtek-app/zephyr/module.yml (board_root = realtek-app)
    # and finds boards like rtl87x3g_watch/rtl8783gbf.
    # The .west/config selects this manifest file via:
    #     manifest.file = applications/hmi/manifest/rtl8773g-zephyr-hmi.yml
    path: realtek-app
    west-commands: applications/hmi/west_commands_extention/west-commands.yml

  remotes:
    - name: origin
      url-base: ssh://cn4soc.rtkbf.com:29418

  defaults:
    remote: origin

  projects:
    - name: zephyr
      repo-path: HoneyRepo/zephyr
      revision: realtek-main-v3.7
      path: zephyr
      import:
        name-allowlist:
          - cmsis
          - tinycrypt
          - mbedtls
          - fatfs

    - name: honeygui
      revision: master
      repo-path: HoneyGUI
      path: modules/honeygui

    - name: lvgl
      revision: lvgl_v9
      repo-path: HoneyRepo/lvgl
      path: modules/lvgl

    - name: display
      revision: master
      repo-path: HoneyRepo/driver/display
      path: modules/display

    - name: wearable
      revision: master
      repo-path: Wearable
      path: modules/wearable

    - name: hal_realtek
      repo-path: HoneyRepo/zephyr-hal
      revision: master
      path: modules/hal/realtek
