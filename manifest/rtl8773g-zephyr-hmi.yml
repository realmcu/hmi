manifest:

    remotes:
      - name: origin
        url-base: ssh://cn4soc.rtkbf.com:29418

    defaults:
      remote: origin

    projects:
      - name: zephyr
        repo-path: HoneyRepo/zephyr
        revision: realtek-main-v3.7
        path: zephyr
        import:
            path-prefix: zephyrproject
            name-allowlist:
              - cmsis
              - tinycrypt
              - mbedtls
              - fatfs

      - name: hal_realtek
        repo-path: HoneyRepo/zephyr-hal
        revision: master
        path: zephyrproject/modules/hal/realtek
        
      - name: realtek-app
        repo-path: HoneyRepo/realtek-zephyr-project
        revision: master
        path: zephyrproject/realtek-app
        
      - name: display
        revision: master
        repo-path: HoneyRepo/driver/display
        path: zephyrproject/modules/display

      - name: wearable
        revision: master
        repo-path: Wearable
        path: zephyrproject/modules/wearable

      - name: honeygui
        revision: master
        repo-path: HoneyGUI
        path: zephyrproject/modules/honeygui

      - name: lvgl
        revision: lvgl_v9
        repo-path: HoneyRepo/lvgl
        path: zephyrproject/modules/lvgl
    self:
        path: zephyrproject/realtek-app/applications/hmi
        west-commands: west_commands_extention/west-commands.yml
        userdata:
            owner: howie_wang
